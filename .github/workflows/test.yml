name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -ldflags "-X main.version=$(git describe --tags --always 2>/dev/null || echo dev)" -o lxspawn ./cmd/lxspawn/

      - name: Vet
        run: go vet ./...

      - name: Test with race detector and coverage
        run: go test -race -cover -coverprofile=coverage.out -count=1 -timeout 5m ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Upload binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: lxspawn-linux-amd64
          path: lxspawn

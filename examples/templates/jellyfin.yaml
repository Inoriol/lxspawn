name: jellyfin
distro: debian:bookworm

resources:
  cpus: 2
  memory: 4G

network:
  mode: adaptive
  interface: auto

volumes:
  - host: /mnt/media
    mount: /media
    readonly: true
  - host: /var/lib/jellyfin
    mount: /var/lib/jellyfin

security:
  capabilities:
    - CAP_NET_BIND_SERVICE

gpu:
  enabled: true
  type: auto

hooks:
  pre_start: |
    #!/bin/bash
    set -euo pipefail
    # Create media directory if it doesn't exist
    mkdir -p /mnt/media
    mkdir -p /var/lib/jellyfin

provision:
  - mode: boot
    script: |
      #!/bin/bash
      set -eux -o pipefail
      # Mask unnecessary services
      systemctl mask systemd-udevd
      systemctl mask systemd-modules-load.service

  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      apt-get update
      apt-get install -y curl gnupg software-properties-common intel-media-va-driver vainfo
      
      # Add Jellyfin repository
      curl -fsSL https://repo.jellyfin.org/jellyfin.gpg | gpg --batch --no-tty --dearmor -o /usr/share/keyrings/jellyfin.gpg
      echo "deb [signed-by=/usr/share/keyrings/jellyfin.gpg arch=amd64] https://repo.jellyfin.org/debian bookworm main" > /etc/apt/sources.list.d/jellyfin.list
      
      apt-get update
      apt-get install -y jellyfin
      systemctl enable --now jellyfin

probes:
  - mode: readiness
    description: "Jellyfin web interface"
    script: |
      #!/bin/bash
      until curl -sf http://localhost:8096/health; do sleep 2; done
    hint: |
      Jellyfin may not have started. Check: journalctl -M {{.Name}} -u jellyfin

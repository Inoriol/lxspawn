name: debian-base
distro: debian:bookworm

resources:
  cpus: 1
  memory: 512M

network:
  mode: host  # Host networking: no isolation, container shares host ports

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      # Update system
      apt-get update
      apt-get upgrade -y
      
      # Install common utilities
      apt-get install -y curl wget vim htop net-tools

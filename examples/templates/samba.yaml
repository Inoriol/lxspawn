name: fileserver
distro: debian:bookworm

resources:
  cpus: 2
  memory: 2G

network:
  mode: adaptive
  interface: auto

volumes:
  - host: /mnt/data
    mount: /data

param:
  smb_user: "fileuser"
  smb_pass: "CHANGE_ME"
  share_name: "data"

security:
  capabilities:
    - CAP_NET_BIND_SERVICE
    - CAP_DAC_OVERRIDE

hooks:
  pre_start: |
    #!/bin/bash
    set -euo pipefail
    mkdir -p /mnt/data

provision:
  - mode: data
    path: /etc/samba/smb.conf
    content: |
      [global]
      workgroup = WORKGROUP
      server string = LXSpawn File Server
      security = user
      map to guest = Never

      [{{.Param.share_name}}]
      path = /data
      browseable = yes
      read only = yes
      guest ok = no
      valid users = {{.Param.smb_user}}
      create mask = 0644
      directory mask = 0755
      force user = {{.Param.smb_user}}

  - mode: system
    script: |
      #!/bin/bash
      set -eu -o pipefail

      if [ "{{.Param.smb_pass}}" = "CHANGE_ME" ]; then
        echo "ERROR: Set smb_pass param before launching"
        exit 1
      fi

      apt-get update
      apt-get install -y samba samba-common-bin

      useradd -M -s /sbin/nologin {{.Param.smb_user}} 2>/dev/null || true

      set +x
      (echo "{{.Param.smb_pass}}"; echo "{{.Param.smb_pass}}") | smbpasswd -s -a {{.Param.smb_user}}
      set -x

      chown {{.Param.smb_user}}: /data

      systemctl enable --now smbd nmbd

probes:
  - mode: readiness
    description: "Samba to be serving"
    script: |
      #!/bin/bash
      until (echo > /dev/tcp/localhost/445) 2>/dev/null; do sleep 2; done
    hint: |
      Samba may not have started. Check: journalctl -M {{.Name}} -u smbd

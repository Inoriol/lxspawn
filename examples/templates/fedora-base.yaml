name: fedora-base
distro: fedora:44

resources:
  cpus: 1
  memory: 512M

network:
  mode: host

provision:
  - mode: boot
    script: |
      #!/bin/bash
      set -eux -o pipefail
      # Mask unnecessary services
      systemctl mask systemd-udevd
      systemctl mask systemd-modules-load.service
      systemctl mask systemd-resolved.service
      
      # Remove resolv.conf symlink and write static DNS config
      rm -f /etc/resolv.conf
      cat > /etc/resolv.conf << 'EOF'
      # Static DNS configuration
      nameserver 8.8.8.8
      nameserver 1.1.1.1
      nameserver 8.8.4.4
      EOF

  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      
      # Overwrite resolv.conf after systemd-resolved has started
      cat > /etc/resolv.conf << 'EOF'
      # Static DNS configuration
      nameserver 8.8.8.8
      nameserver 1.1.1.1
      nameserver 8.8.4.4
      EOF
      
      # Update system
      dnf upgrade -y
      
      # Install common utilities
      dnf install -y curl wget vim htop net-tools

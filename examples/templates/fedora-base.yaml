name: fedora-base
distro: fedora:44

resources:
  cpus: 1
  memory: 512M

network:
  mode: host  # Host networking: no isolation, container shares host ports

param:
  dns1: "8.8.8.8"
  dns2: "1.1.1.1"
  dns3: "8.8.4.4"

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      
      # Overwrite resolv.conf (systemd-resolved starts before boot scripts, so boot mode doesn't work)
      cat > /etc/resolv.conf << EOF
      # Static DNS configuration
      nameserver {{.Param.dns1}}
      nameserver {{.Param.dns2}}
      nameserver {{.Param.dns3}}
      EOF
      
      # Update system only on first provision
      if [ ! -f /etc/lxspawn-upgraded ]; then
        dnf upgrade -y
        touch /etc/lxspawn-upgraded
      fi
      
      # Install common utilities
      dnf install -y curl wget vim htop net-tools

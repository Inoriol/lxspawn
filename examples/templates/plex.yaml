name: plex
distro: debian:bookworm

resources:
  cpus: 2
  memory: 4G

network:
  mode: adaptive
  interface: auto

volumes:
  - host: /mnt/media  # Create this directory on host or change path
    mount: /media
    readonly: true
  - host: /var/lib/plex  # Create this directory on host or change path
    mount: /var/lib/plex

security:
  capabilities:
    - CAP_NET_BIND_SERVICE

gpu:
  enabled: true
  type: auto

hooks:
  pre_start: |
    #!/bin/bash
    set -euo pipefail
    # Create directories if they don't exist
    mkdir -p /mnt/media
    mkdir -p /var/lib/plex

provision:
  - mode: boot
    script: |
      #!/bin/bash
      set -eux -o pipefail
      # Mask unnecessary services
      systemctl mask systemd-udevd
      systemctl mask systemd-modules-load.service

  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      apt-get update
      apt-get install -y curl gnupg software-properties-common vainfo
      
      # Install GPU drivers (install both Intel and AMD for compatibility)
      # Intel iGPU/dGPU: intel-media-va-driver is in Debian repos
      apt-get install -y intel-media-va-driver || true
      # intel-compute-runtime not in Debian bookworm, try to install but don't fail
      apt-get install -y intel-compute-runtime || echo "intel-compute-runtime not available, using software decoding"
      # AMD iGPU/dGPU:
      apt-get install -y mesa-va-drivers || true
      apt-get install -y rocm-opencl-runtime || true
      # NVIDIA: requires proprietary driver matching host version exactly
      # apt-get install -y nvidia-driver-XXX
      
      # Add Plex repository
      curl -fsSL https://downloads.plex.tv/plex-keys/PlexSign.key | gpg --batch --no-tty --dearmor -o /usr/share/keyrings/plex.gpg
      echo "deb [signed-by=/usr/share/keyrings/plex.gpg] https://downloads.plex.tv/repo/deb public main" > /etc/apt/sources.list.d/plexmediaserver.list
      
      apt-get update
      apt-get install -y plexmediaserver
      systemctl enable --now plexmediaserver

probes:
  - mode: readiness
    description: "Plex web interface"
    script: |
      #!/bin/bash
      until curl -sf http://localhost:32400/identity; do sleep 2; done
    hint: |
      Plex may not have started. Check: journalctl -M {{.Name}} -u plexmediaserver

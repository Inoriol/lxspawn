name: ubuntu-base
distro: ubuntu:noble

resources:
  cpus: 1
  memory: 512M

network:
  mode: host  # Host networking: no isolation, container shares host ports

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      # Update system and install utilities in one go
      apt-get update
      apt-get install -y ca-certificates curl wget vim htop net-tools
      apt-get upgrade -y

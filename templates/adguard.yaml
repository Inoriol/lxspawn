name: adguard
distro: debian:bookworm

resources:
  cpus: 1
  memory: 512M

network:
  mode: adaptive
  interface: auto

param:
  adguard_ip: "192.168.0.101/24"
  gateway: "192.168.0.1"
  dns1: "8.8.8.8"
  dns2: "8.8.4.4"
  version: "v0.107.55"
  admin_user: "admin"
  admin_pass: "CHANGE_ME"

provision:
  - mode: data
    path: /etc/systemd/network/10-eth.network
    content: |
      [Match]
      Name=eth* mv-*
      
      [Network]
      Address={{.Param.adguard_ip}}
      Gateway={{.Param.gateway}}
      DNS={{.Param.dns1}}
      DNS={{.Param.dns2}}

  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail

      if [ "$LXSPAWN_PARAM_admin_pass" = "CHANGE_ME" ]; then
        echo "ERROR: Set admin_pass param before launching"
        exit 1
      fi

      apt-get update
      apt-get install -y curl iproute2 dnsutils
      
      curl -s -S -L "https://raw.githubusercontent.com/AdguardTeam/AdGuardHome/${LXSPAWN_PARAM_version}/scripts/install.sh" | sh -s -- -v
      
      set +x
      PASS_HASH=$(cd /opt/AdGuardHome && ./AdGuardHome -m "$LXSPAWN_PARAM_admin_pass" 2>/dev/null || echo "")
      if [ -z "$PASS_HASH" ]; then
        PASS_HASH="$LXSPAWN_PARAM_admin_pass"
      fi
      set -x
      
      cat > /opt/AdGuardHome/AdGuardHome.yaml <<EOF
      bind_host: 0.0.0.0
      bind_port: 80
      users:
        - name: ${LXSPAWN_PARAM_admin_user}
          password: '$PASS_HASH'
      dns:
        bind_hosts:
          - 0.0.0.0
        port: 53
        upstream_dns:
          - ${LXSPAWN_PARAM_dns1}
          - ${LXSPAWN_PARAM_dns2}
      EOF
      
      systemctl enable --now AdGuardHome

probes:
  - mode: readiness
    description: "AdGuard Home to be serving DNS"
    script: |
      #!/bin/bash
      set -eu
      for i in $(seq 1 30); do
        dig @localhost example.com +short 2>/dev/null | grep -q . && exit 0
        sleep 2
      done
      echo "AdGuard Home did not become ready in time" >&2
      exit 1
    hint: |
      AdGuard may not have started. Check: journalctl -M {{.Name}} -u AdGuardHome

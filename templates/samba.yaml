name: fileserver
distro: debian:bookworm

resources:
  cpus: 2
  memory: 2G

network:
  mode: adaptive
  interface: auto

volumes:
  - host: /mnt/data
    mount: /data

param:
  smb_user: "fileuser"
  smb_pass: "CHANGE_ME"
  share_name: "data"

security:
  capabilities:
    - CAP_NET_BIND_SERVICE

hooks:
  pre_start: |
    #!/bin/bash
    set -euo pipefail
    mkdir -p /mnt/data

provision:
  - mode: data
    path: /etc/samba/smb.conf
    content: |
      [global]
      workgroup = WORKGROUP
      server_string = LXSpawn File Server
      security = user
      map to guest = Never

      [{{.Param.share_name}}]
      path = /data
      browseable = yes
      read only = yes
      guest ok = no
      valid users = {{.Param.smb_user}}
      create mask = 0644
      directory mask = 0755
      force user = {{.Param.smb_user}}

  - mode: system
    script: |
      #!/bin/bash
      set -eu -o pipefail

      if [ "$LXSPAWN_PARAM_smb_pass" = "CHANGE_ME" ]; then
        echo "ERROR: Set smb_pass param before launching"
        exit 1
      fi

      apt-get update
      apt-get install -y samba samba-common-bin

      useradd -M -s /sbin/nologin "$LXSPAWN_PARAM_smb_user" 2>/dev/null || true

      set +x
      (echo "$LXSPAWN_PARAM_smb_pass"; echo "$LXSPAWN_PARAM_smb_pass") | smbpasswd -s -a "$LXSPAWN_PARAM_smb_user"
      set -x

      chown "$LXSPAWN_PARAM_smb_user": /data

      systemctl enable --now smbd nmbd

probes:
  - mode: readiness
    description: "Samba to be serving"
    script: |
      #!/bin/bash
      set -eu
      for i in $(seq 1 30); do
        (echo > /dev/tcp/localhost/445) 2>/dev/null && exit 0
        sleep 2
      done
      echo "Samba did not become ready in time" >&2
      exit 1
    hint: |
      Samba may not have started. Check: journalctl -M {{.Name}} -u smbd

name: docker-host
distro: debian:bookworm

# NOTE: This template runs Docker inside a container with reduced isolation.
# The pre_start hook enables IP forwarding and loads br_netfilter on the host,
# which affects all network workloads on the host, not just this container.

resources:
  cpus: 2
  memory: 2G
  tasks: infinity

network:
  mode: adaptive
  interface: auto

security:
  seccomp: false
  capabilities:
    - CAP_NET_ADMIN
    - CAP_NET_RAW
    - CAP_SYS_ADMIN
    - CAP_BPF

hooks:
  pre_start: |
    #!/bin/bash
    set -euo pipefail
    echo 1 > /proc/sys/net/ipv4/ip_forward
    modprobe br_netfilter || true
    echo 1 > /proc/sys/net/bridge/bridge-nf-call-iptables 2>/dev/null || true

  post_start: |
    #!/bin/bash
    set -euo pipefail
    # Wait for container to be ready
    sleep 2

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      apt-get update
      apt-get install -y ca-certificates curl gnupg
      install -m 0755 -d /etc/apt/keyrings
      
      rm -f /etc/apt/keyrings/docker.gpg
      curl -fsSL https://download.docker.com/linux/debian/gpg -o /tmp/docker.gpg.asc
      gpg --batch --no-tty --dearmor -o /etc/apt/keyrings/docker.gpg /tmp/docker.gpg.asc
      rm -f /tmp/docker.gpg.asc
      chmod a+r /etc/apt/keyrings/docker.gpg
      
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable" > /etc/apt/sources.list.d/docker.list
      
      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      
      mkdir -p /etc/docker
      cat > /etc/docker/daemon.json <<'EOF'
      {
        "exec-opts": ["native.cgroupdriver=cgroupfs"],
        "storage-driver": "overlay2"
      }
      EOF
      
      systemctl enable docker.service
      
      groupadd -r docker 2>/dev/null || true

probes:
  - mode: readiness
    description: "Docker daemon to be running"
    script: |
      #!/bin/bash
      set -eu
      for i in $(seq 1 30); do
        systemctl is-active --quiet docker 2>/dev/null && exit 0
        sleep 2
      done
      echo "Docker did not become ready in time" >&2
      exit 1
    hint: |
      Docker may not have started. Check: journalctl -M {{.Name}} -u docker

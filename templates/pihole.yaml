name: pihole
distro: debian:bookworm

resources:
  cpus: 1
  memory: 512M

network:
  mode: adaptive
  interface: auto

param:
  pihole_ip: "192.168.0.100/24"
  gateway: "192.168.0.1"
  dns1: "8.8.8.8"
  dns2: "8.8.4.4"
  web_password: "CHANGE_ME"
  version: "v5.18.3"

provision:
  - mode: data
    path: /etc/systemd/network/10-eth.network
    content: |
      [Match]
      Name=eth* mv-*
      
      [Network]
      Address={{.Param.pihole_ip}}
      Gateway={{.Param.gateway}}
      DNS={{.Param.dns1}}
      DNS={{.Param.dns2}}

  - mode: system
    script: |
      #!/bin/bash
      set -eu -o pipefail

      if [ "$LXSPAWN_PARAM_web_password" = "CHANGE_ME" ]; then
        echo "ERROR: Set web_password param before launching"
        exit 1
      fi

      apt-get update
      apt-get install -y curl iproute2 dnsutils
      
      INTERFACE=$(ip -o link show | grep -E 'eth|mv-' | head -1 | awk '{print $2}' | tr -d ':')
      if [ -z "$INTERFACE" ]; then
        echo "WARNING: Could not detect network interface, using eth0"
        INTERFACE="eth0"
      fi
      
      mkdir -p /etc/pihole
      cat > /etc/pihole/setupVars.conf <<EOF
      PIHOLE_INTERFACE=${INTERFACE}
      IPV4_ADDRESS=${LXSPAWN_PARAM_pihole_ip}
      PIHOLE_DNS_1=${LXSPAWN_PARAM_dns1}
      PIHOLE_DNS_2=${LXSPAWN_PARAM_dns2}
      WEBPASSWORD=${LXSPAWN_PARAM_web_password}
      INSTALL_WEB_INTERFACE=true
      LIGHTTPD_ENABLED=true
      EOF
      
      export PIHOLE_BRANCH="${LXSPAWN_PARAM_version}"
      curl -sSL https://install.pi-hole.net | bash /dev/stdin --unattended
      
      systemctl enable --now pihole-FTL

probes:
  - mode: readiness
    description: "Pi-hole to be serving DNS"
    script: |
      #!/bin/bash
      set -eu
      for i in $(seq 1 30); do
        dig @localhost example.com +short 2>/dev/null | grep -q . && exit 0
        sleep 2
      done
      echo "Pi-hole did not become ready in time" >&2
      exit 1
    hint: |
      Pi-hole may not have started. Check: journalctl -M {{.Name}} -u pihole-FTL
